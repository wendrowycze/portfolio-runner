<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio Arkadiusza Kleja jako gra: Hotel -> Obraz -> Runner"
    />
    <title>Portfolio Runner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23261619'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%23DFB67C' stroke-width='3'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23DFB67C'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="game" data-layout="side">
      <section id="panel" aria-label="Panel opowieści">
        <header class="panel-header">
          <h1 id="panel-title">Portfolio Runner</h1>
          <p id="panel-lead">
            Etap 1: silnik biegu. Postać biegnie sama — Ty tylko skaczesz nad przeszkodami.
          </p>
        </header>
        <ul class="panel-hints" aria-label="Sterowanie">
          <li><kbd>Spacja</kbd> lub <kbd>↑</kbd> — skok</li>
          <li>Na telefonie: dotknij obszar biegu</li>
          <li><kbd>F3</kbd> — dane techniczne (FPS, prędkość)</li>
        </ul>
      </section>
      <section id="runner" aria-label="Scena biegu"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
